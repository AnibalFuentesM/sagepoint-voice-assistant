<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Página no encontrada | Sagepoint Analytics</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87,900&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" />
<style>
  :root{--black:#000;--card:#141a19;--bone:#f3f0e8;--ash:#7d8f8a;--mute:#4d5b57;--mint:#63e6be;--rule:rgba(243,240,232,.11)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--black);color:var(--bone);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
  body{display:grid;place-items:center;min-height:100dvh;padding:32px 16px;
    background:radial-gradient(60% 50% at 50% 38%,rgba(99,230,190,.10),transparent 70%),var(--black)}
  main{width:100%;max-width:640px;text-align:center}
  img{display:block;width:min(207px,52vw);height:auto;margin:0 auto 22px;animation:float 4.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
  .code{margin:0 0 10px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mint)}
  h1{margin:0;font-family:'Archivo',Impact,system-ui,sans-serif;font-weight:900;font-variation-settings:'wdth' 87;
    font-size:clamp(34px,7vw,58px);line-height:.95;letter-spacing:-.03em;text-transform:uppercase}
  p.lede{margin:16px auto 0;max-width:460px;color:var(--ash);font-size:15.5px;line-height:1.55}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
  a.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:60px;
    font-weight:500;font-size:14px;text-decoration:none;transition:background .2s ease,box-shadow .2s ease}
  a.fill{background:var(--bone);color:#05100d}
  a.fill:hover,a.fill:focus-visible{background:#fff}
  a.ghost{color:var(--bone);box-shadow:inset 0 0 0 1px var(--rule)}
  a.ghost:hover,a.ghost:focus-visible{box-shadow:inset 0 0 0 1px var(--mint)}
  a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/img/mago-404.webp" width="414" height="480" alt="" aria-hidden="true" />
  <p class="code">Error 404</p>
  <h1 data-es="Esta página se perdió entre los datos" data-en="This page got lost in the data">Esta página se perdió entre los datos</h1>
  <p class="lede" data-es="El enlace puede estar viejo o mal escrito. Desde aquí te llevamos a lo que sí existe." data-en="The link may be outdated or mistyped. Here is what does exist.">El enlace puede estar viejo o mal escrito. Desde aquí te llevamos a lo que sí existe.</p>
  <nav>
    <a class="pill fill" href="/" data-href-en="/en/" data-es="Ir al inicio" data-en="Go to the home page">Ir al inicio</a>
    <a class="pill ghost" href="/servicios/" data-href-en="/en/services/" data-es="Ver servicios" data-en="See services">Ver servicios</a>
    <a class="pill ghost" href="https://wa.me/50240464716" data-es="Escribir por WhatsApp" data-en="Message us on WhatsApp" rel="noopener noreferrer">Escribir por WhatsApp</a>
  </nav>
</main>
<script>
  // English copy for anything under /en/; Spanish is the default markup.
  if (/^\/en(\/|$)/.test(location.pathname)) {
    document.documentElement.lang = 'en';
    document.title = 'Page not found | Sagepoint Analytics';
    document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.getAttribute('data-en'); });
    document.querySelectorAll('[data-href-en]').forEach(function (el) { el.setAttribute('href', el.getAttribute('data-href-en')); });
  }
</script>
</body>
</html>
